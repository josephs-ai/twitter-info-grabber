name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing should not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      # The GUI backend is the one genuinely platform-specific piece. On Linux
      # it needs system packages pip cannot provide.
      - name: Install GTK/WebKit (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-webkit2-4.1 libgirepository1.0-dev

      - name: Smoke tests
        run: python tests/smoke.py

      - name: CLI responds
        run: python -m tracker --help

      - name: Pipeline runs offline stages end to end
        run: python -m tracker --db ci.db daily --skip collect replies suggest links judge extract
