<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Signal</title>
<style>
/* ---------------------------------------------------------------------------
   Assay readout.

   The product measures a stream and reports the residue: ~2,600 posts in, a
   handful out. That ratio is the whole thesis, so the funnel is a permanent
   fixture rather than a stat on a dashboard page.

   Two typographic registers do the structural work, since a desktop app has no
   web fonts to lean on: monospace, uppercase and tracked, for everything the
   machine measured — labels, counts, handles, figures. Proportional sans for
   everything a human wrote. You can tell at a glance which is which.

   Warm graphite rather than the usual blue-black, and one amber signal colour
   used only where something survived the filter.
--------------------------------------------------------------------------- */
:root {
  --ink:    #131110;
  --panel:  #1a1816;
  --raise:  #23201d;
  --rule:   #2c2825;
  --paper:  #e9e4da;
  --muted:  #8b8478;
  --faint:  #5d574e;
  --signal: #e0a63c;
  --moss:   #8aa46b;
  --rust:   #cd6f55;
  --mono: ui-monospace, "Ubuntu Mono", "DejaVu Sans Mono", monospace;
  --sans: system-ui, "Ubuntu", "Cantarell", sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --ink: #f4f1eb; --panel: #fffefb; --raise: #eae5db; --rule: #ded7c9;
    --paper: #1c1a17; --muted: #6d6559; --faint: #9a9284;
    --signal: #9a6a10; --moss: #4d6b34; --rust: #a8452c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--paper);
  font: 14.5px/1.6 var(--sans);
  display: grid; grid-template-columns: 186px minmax(0, 1fr);
  overflow: hidden;
}
::selection { background: var(--signal); color: var(--ink); }

/* --- left rail ----------------------------------------------------------- */
nav {
  background: var(--panel); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; overflow: hidden;
}
.mark {
  font: 600 11px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase;
  padding: 20px 16px 6px; color: var(--paper);
}
.mark i { color: var(--signal); font-style: normal; }
.tagline {
  font: 10px/1.55 var(--mono); color: var(--faint); padding: 0 14px 20px;
  letter-spacing: .02em;
}
.navlist { flex: 1; overflow-y: auto; padding: 0 8px; }
nav button {
  display: block; width: 100%; background: none; border: 0; cursor: pointer;
  color: var(--muted); text-align: left; padding: 6px 8px; border-radius: 4px;
  font: 12.5px/1.5 var(--sans);
}
nav button:hover { color: var(--paper); background: var(--raise); }
nav button.on { color: var(--ink); background: var(--signal); font-weight: 600; }
nav button:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }
.group {
  font: 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  color: var(--faint); padding: 18px 8px 7px;
}
nav button b {
  float: right; font: 10px/1.6 var(--mono); color: var(--signal); font-weight: 600;
}
nav button.on b { color: var(--ink); }

/* --- the assay bar: this app's signature ---------------------------------- */
.assay { border-top: 1px solid var(--rule); padding: 14px 16px 16px; }
.assay h4 {
  margin: 0 0 10px; font: 10px/1 var(--mono); letter-spacing: .16em;
  text-transform: uppercase; color: var(--faint);
}
.stage { margin-bottom: 9px; }
.stage .lab {
  display: flex; justify-content: space-between; align-items: baseline;
  font: 10.5px/1.4 var(--mono); color: var(--muted); letter-spacing: .04em;
}
.stage .lab b { color: var(--paper); font-weight: 500; }
.track { height: 3px; background: var(--raise); margin-top: 3px; border-radius: 2px; }
.track i { display: block; height: 100%; background: var(--muted); border-radius: 2px; }
.stage.out .track i { background: var(--signal); }
.stage.out .lab b { color: var(--signal); }

/* --- status: the machinery, always visible -------------------------------- */
.statusbar { border-top: 1px solid var(--rule); padding: 13px 16px 16px; }
.statusbar h4 {
  margin: 0 0 9px; font: 10px/1 var(--mono); letter-spacing: .16em;
  text-transform: uppercase; color: var(--faint);
}
.chk {
  display: grid; grid-template-columns: 7px 1fr; gap: 7px; align-items: baseline;
  font: 10.5px/1.5 var(--mono); color: var(--muted); margin-bottom: 6px;
}
.chk i {
  width: 5px; height: 5px; border-radius: 50%; background: var(--moss);
  align-self: center;
}
.chk.warn i { background: var(--signal); }
.chk.fail i { background: var(--rust); }
.chk b {
  grid-column: 2; display: block; font-weight: 400; color: var(--faint);
  font-size: 10px;
}
.chk.fail b { color: var(--rust); }

/* --- content ------------------------------------------------------------- */
main { overflow-y: auto; padding: 30px 40px 80px; }
.wrap, .wide { margin: 0 auto; }
.wrap { max-width: 66ch; }
.wide-data { max-width: 940px; }          /* prose beyond this is unreadable */
.wide { max-width: 900px; }
h1 {
  font: 600 20px/1.25 var(--sans); margin: 0 0 5px; letter-spacing: -.01em;
}
.lede { color: var(--muted); font-size: 13.5px; margin-bottom: 26px; }

/* entries: hairline-separated, not boxed. a signal rule marks what survived. */
.entry { border-top: 1px solid var(--rule); padding: 22px 0 24px; }
.entry:first-of-type { border-top: 0; padding-top: 4px; }
.entry.surfaced { border-left: 2px solid var(--signal); padding-left: 18px; margin-left: -20px; }

.byline {
  display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  font: 11px/1.6 var(--mono); letter-spacing: .05em; color: var(--faint);
  text-transform: uppercase; margin-bottom: 11px;
}
.who { color: var(--signal); cursor: pointer; text-transform: none; letter-spacing: .02em; }
.who:hover { text-decoration: underline; }
.byline .amp { color: var(--moss); }

.headline { font: 600 17px/1.4 var(--sans); margin-bottom: 12px; letter-spacing: -.005em; }
.claims { margin: 0 0 15px; padding: 0; list-style: none; }
.claims li { position: relative; padding-left: 15px; margin-bottom: 6px; color: var(--paper); }
.claims li::before {
  content: ""; position: absolute; left: 0; top: .72em;
  width: 5px; height: 1px; background: var(--faint);
}

/* figures read as instrument readings: value large in mono, label beneath */
/* One reading per row: the model's descriptions are full phrases, and a
   column layout chopped them mid-word. Value stays in mono so figures align. */
.figs {
  margin: 0 0 17px; border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule); padding: 11px 0;
}
.fig { display: flex; gap: 14px; align-items: baseline; padding: 3px 0; }
.fig b {
  flex: 0 0 auto; min-width: 5.5ch; font: 500 15px/1.35 var(--mono);
  color: var(--signal); letter-spacing: -.01em;
}
.fig span { color: var(--muted); font-size: 13px; line-height: 1.45; }
.sowhat {
  border-left: 1px solid var(--rule); padding-left: 13px; color: var(--muted);
  font-size: 13.5px; margin-bottom: 15px;
}
.ents { font: 10.5px/1.7 var(--mono); color: var(--faint); margin-bottom: 14px;
        letter-spacing: .04em; }
.ents b { color: var(--muted); font-weight: 400; }
.text { white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
.orig summary {
  font: 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  color: var(--faint); cursor: pointer; padding: 4px 0; list-style: none;
}
.orig summary::before { content: "+ "; }
.orig[open] summary::before { content: "- "; }
.orig summary:hover { color: var(--muted); }
.orig .text { margin-top: 10px; color: var(--muted); font-size: 13.5px; }
.imgs { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 14px; }
.imgs img { max-width: 250px; max-height: 180px; border: 1px solid var(--rule); }
.verdict em {
    display: block; font-style: normal; font-family: var(--mono);
    font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 5px;
  }
  .verdict {
  font: 11px/1.6 var(--mono); color: var(--faint); margin-bottom: 14px;
  border-left: 1px solid var(--rule); padding-left: 13px;
}

/* Corroboration: the same story from independent accounts, folded into one
   entry. The count is the point — six people bothering is itself evidence. */
.also {
  font: 11px/1.7 var(--mono); color: var(--muted); margin-bottom: 14px;
  border-left: 1px solid var(--moss); padding-left: 13px;
}
.also em {
  display: block; font-style: normal; font-size: 9.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--faint); margin-bottom: 4px;
}
.also .who { margin-right: 12px; cursor: pointer; color: var(--moss); }
.also .who:hover { text-decoration: underline; }

.byline .new {
  color: var(--ink); background: var(--signal); padding: 1px 6px;
  border-radius: 3px; font-weight: 600;
}
.sorts { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
.sorts .act.on { border-color: var(--signal); color: var(--signal); }
.sorts .act:last-child { margin-left: auto; }

/* --- first run ------------------------------------------------------------ */
.step {
  display: grid; grid-template-columns: 26px 1fr; gap: 15px;
  padding: 17px 0; border-bottom: 1px solid var(--rule); align-items: start;
}
.step .dot {
  width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--rule);
  display: grid; place-items: center; color: var(--faint);
  font: 11px/1 var(--mono);
}
.step.done .dot { border-color: var(--moss); color: var(--moss); }
.step.now .dot { border-color: var(--signal); color: var(--signal); }
.step.done > div > b { color: var(--muted); font-weight: 500; }
.step > div > b { display: block; margin-bottom: 3px; }
.stepact { margin-top: 13px; }
.stepact .searchbar { max-width: 460px; }
code {
  font: 12px var(--mono); background: var(--raise); padding: 1px 5px;
  border-radius: 3px;
}

/* --- search --------------------------------------------------------------- */
.searchbar { display: flex; gap: 9px; margin: 0 0 26px; }
.searchbar input {
  flex: 1; background: var(--panel); border: 1px solid var(--rule);
  border-radius: 4px; padding: 10px 13px; color: var(--paper);
  font: 14px/1.5 var(--sans);
}
.searchbar input:focus {
  outline: none; border-color: var(--signal);
}

/* --- strictness control -------------------------------------------------- */
.bar-tool {
  border: 1px solid var(--rule); border-radius: 4px; padding: 15px 17px 17px;
  margin-bottom: 24px; background: var(--panel);
}
.bar-head {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 14px; margin-bottom: 4px;
}
.bar-head .lbl {
  font: 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  color: var(--faint);
}
.bar-head .now { font: 500 14px/1.3 var(--sans); color: var(--paper); }
.bar-head .cnt { font: 500 13px/1.3 var(--mono); color: var(--signal); }
.bar-note { color: var(--muted); font-size: 12.5px; margin-bottom: 13px; min-height: 2.6em; }

input[type=range].slider {
  -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
  background: var(--rule); border-radius: 2px; outline: none; margin: 4px 0 0;
}
input[type=range].slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 15px; height: 15px;
  border-radius: 50%; background: var(--signal); cursor: pointer;
  border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--signal);
}
input[type=range].slider::-moz-range-thumb {
  width: 15px; height: 15px; border-radius: 50%; background: var(--signal);
  cursor: pointer; border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--signal);
}
input[type=range].slider:focus-visible { outline: 2px solid var(--signal); outline-offset: 4px; }
.ticks {
  display: flex; justify-content: space-between; margin-top: 9px;
  font: 9.5px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  color: var(--faint);
}
.ticks span { flex: 1; text-align: center; cursor: pointer; }
.ticks span:first-child { text-align: left; }
.ticks span:last-child { text-align: right; }
.ticks span.on { color: var(--signal); }

/* --- overview: hero number + composition bar ------------------------------ */
.hero { display: flex; align-items: baseline; gap: 18px; margin: 4px 0 28px; }
.hero .n {
  font: 500 66px/0.9 var(--mono); color: var(--signal); letter-spacing: -.04em;
}
.hero .t { font-size: 14.5px; color: var(--muted); max-width: 34ch; }
.hero .t b { color: var(--paper); font-weight: 500; display: block; font-size: 15px; }

.compo { margin-bottom: 10px; }
/* One hue at varying lightness: these are parts of a whole, not identities,
   so a categorical palette would imply a distinction that is not there. */
.bar2 { display: flex; height: 30px; gap: 2px; }
.seg { position: relative; min-width: 3px; transition: filter .12s; }
.seg:hover { filter: brightness(1.35); }
.seg:first-child { border-radius: 3px 0 0 3px; }
.seg:last-child  { border-radius: 0 3px 3px 0; }
.legend2 {
  display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 13px;
  font: 11px/1.6 var(--mono);
}
.legend2 div { display: flex; align-items: baseline; gap: 7px; color: var(--muted); }
.legend2 i { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto;
             transform: translateY(-1px); }
.legend2 b { color: var(--paper); font-weight: 500; }

/* --- schedule page ------------------------------------------------------- */
.field { margin-bottom: 22px; }
.field > label {
  display: block; font: 10px/1 var(--mono); letter-spacing: .16em;
  text-transform: uppercase; color: var(--faint); margin-bottom: 9px;
}
.field .hint { color: var(--muted); font-size: 12.5px; margin: -4px 0 9px; }
.choices { display: flex; gap: 8px; flex-wrap: wrap; }
.choice {
  border: 1px solid var(--rule); padding: 9px 13px; cursor: pointer;
  font: 12px/1.4 var(--sans); color: var(--muted); border-radius: 3px;
}
.choice:hover { border-color: var(--muted); color: var(--paper); }
.choice.on { border-color: var(--signal); color: var(--paper); background: var(--raise); }
.choice b { display: block; font: 500 12.5px/1.4 var(--sans); color: var(--paper); }
.choice span { font: 10.5px/1.4 var(--mono); color: var(--faint); }
.times { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.times input {
  background: var(--ink); color: var(--paper); border: 1px solid var(--rule);
  font: 12px var(--mono); padding: 7px 9px; border-radius: 3px; width: 92px;
}
.times input:focus { outline: 1px solid var(--signal); }
.stages-list { display: grid; gap: 2px; }
.stg {
  display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start;
  padding: 8px 10px; border: 1px solid transparent; cursor: pointer; border-radius: 3px;
}
.stg:hover { border-color: var(--rule); }
.stg .box {
  width: 15px; height: 15px; border: 1px solid var(--rule); margin-top: 3px;
  display: grid; place-items: center; font: 10px/1 var(--mono); color: var(--ink);
}
.stg.on .box { background: var(--signal); border-color: var(--signal); }
.stg .box::after { content: ""; }
.stg.on .box::after { content: "x"; }
.stg b { font: 500 13px/1.4 var(--sans); }
.stg span { display: block; font-size: 12px; color: var(--muted); }
.stg.cost b::after { content: " · costs credit"; color: var(--signal);
  font: 10px var(--mono); letter-spacing: .1em; }
.banner {
  border: 1px solid var(--rule); border-left: 2px solid var(--signal);
  padding: 11px 14px; margin-bottom: 22px; font-size: 13px; color: var(--muted);
}
.banner b { color: var(--paper); font-weight: 500; }
.banner.warn { border-left-color: var(--rust); }
.cmd {
  font: 11px/1.6 var(--mono); color: var(--faint); background: var(--panel);
  border: 1px solid var(--rule); padding: 9px 11px; word-break: break-all;
  margin-top: 10px;
}

/* --- controls ------------------------------------------------------------ */
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button.act {
  background: none; color: var(--muted); border: 1px solid var(--rule);
  padding: 5px 12px; cursor: pointer; border-radius: 3px;
  font: 11px/1.5 var(--mono); letter-spacing: .09em; text-transform: uppercase;
}
button.act:hover { color: var(--paper); border-color: var(--muted); }
button.act.primary {
  background: var(--signal); border-color: var(--signal); color: var(--ink);
  font-weight: 600;
}
button.act.primary:hover { filter: brightness(1.08); color: var(--ink); }
button.act:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }
button.act.good.on { background: var(--moss); border-color: var(--moss); color: var(--ink); }
button.act.bad.on  { background: var(--rust); border-color: var(--rust); color: var(--ink); }

.metrics { display: flex; flex-wrap: wrap; gap: 28px 40px; margin-bottom: 30px; }
.metric b { display: block; font: 500 26px/1.1 var(--mono); letter-spacing: -.02em; }
.metric span {
  display: block; font: 10.5px/1.4 var(--mono); color: var(--muted);
  text-transform: uppercase; letter-spacing: .09em; margin-top: 5px;
}
.note { border-left: 2px solid var(--signal); padding: 2px 0 2px 15px; color: var(--muted);
        font-size: 13.5px; margin-top: 8px; }
.empty { color: var(--faint); font: 12px/1.6 var(--mono); padding: 40px 0;
         letter-spacing: .05em; }
.cand { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start;
        border-top: 1px solid var(--rule); padding: 14px 0; }
.cand:first-child { border-top: 0; }
.bio { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.log {
  border: 1px solid var(--rule); padding: 12px 14px; margin-top: 18px;
  font: 11.5px/1.7 var(--mono); white-space: pre-wrap; color: var(--muted);
  max-height: 240px; overflow-y: auto;
}
.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
@keyframes pulse { 50% { opacity: .35; } }
.busy { animation: pulse 1.1s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .busy { animation: none; } }
</style>
</head>
<body>
<nav>
  <div class="mark">AI<i>/</i>Signal</div>
  <div class="tagline">reads the field<br>so you don't</div>
  <div class="navlist">
    <button data-v="home" class="on">Today</button>
    <div class="group">Read</div>
    <button data-v="surfaced">Surfaced<b id="unread"></b></button>
    <button data-v="amplified">Corroborated</button>
    <button data-v="search">Search</button>
    <div class="group">Teach</div>
    <button data-v="unrated">Rate queue</button>
    <button data-v="nearmiss">Near misses</button>
    <div class="group">Sources</div>
    <button data-v="candidates">Candidates</button>
    <button data-v="pipeline">Pipeline</button>
  <button data-v="schedule">Schedule</button>
  <button data-v="curate">Self-curation</button>
  <button data-v="setup" id="setuplink" hidden>Setting up</button>
  </div>
  <div class="assay" id="assay"></div>
  <div class="statusbar" id="status"></div>
</nav>
<main id="main"><div class="empty">reading database…</div></main>

<script>
const api = () => window.pywebview.api;
const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (n) => (n || 0).toLocaleString();
let view = 'home';

function when(iso) {
  if (!iso) return '';
  const d = new Date(iso), h = (Date.now() - d) / 36e5;
  if (h < 1) return 'just now';
  if (h < 24) return Math.round(h) + 'h ago';
  if (h < 48) return 'yesterday';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

/* The funnel, always on screen: what came in and what survived each stage. */
function assay(o) {
  const f = o.funnel || {};
  const collected = o.posts || 0;
  const kept = (f.triaged || 0) + (f.judged || 0) + (f.published || 0);
  const stages = [
    ['collected', collected, false],
    ['kept', kept, false],
    ['judged', o.judged || 0, false],
    ['surfaced', o.surfaced || 0, true],
  ];
  const max = Math.max(...stages.map(s => s[1]), 1);
  document.getElementById('assay').innerHTML = `<h4>Assay</h4>` + stages.map(
    ([label, value, out]) => `<div class="stage ${out ? 'out' : ''}">
      <div class="lab"><span>${label}</span><b>${num(value)}</b></div>
      <div class="track"><i style="width:${Math.max(1.5, value / max * 100)}%"></i></div>
    </div>`).join('');
}

// A figure's label is a slot, not a sentence: keep it to a few words.
function fitLabel(t) {
  t = (t || '').replace(/^(the |a |an |number of )/i, '').trim();
  const words = t.split(/\s+/);
  let out = '';
  for (const w of words) {
    if ((out + ' ' + w).trim().length > 22) break;
    out = (out + ' ' + w).trim();
  }
  return out || t.slice(0, 22);
}

function entry(it, rateable) {
  const ex = it.extraction || null;
  const bits = [`<span class="who" onclick="ext('${it.url}')">@${esc(it.author_handle)}</span>`,
                `<span>${when(it.created_at)}</span>`];
  if (it.thread_size > 1) bits.push(`<span>thread/${it.thread_size}</span>`);
  if (it.capture_source === 'reply') bits.push(`<span>reply</span>`);
  if (it.amplifiers > 0) bits.push(`<span class="amp">shared ×${it.amplifiers}</span>`);
  if (it.novelty) bits.push(`<span>n${it.novelty} v${it.value}</span>`);
  if (it.category) bits.push(`<span>${esc(it.category)}</span>`);
  const also = it.also || [];
  if (also.length) bits.push(`<span class="amp">${also.length + 1} sources</span>`);
  if (it.seen === false) bits.unshift(`<span class="new">new</span>`);

  // No truncation: the row layout gives descriptions room to wrap as prose.
  const figs = (ex && ex.numbers || []).slice(0, 5).map(n =>
    `<div class="fig"><b>${esc(n.value)}</b><span>${esc(n.measures)}</span></div>`
  ).join('');

  const ents = (ex && ex.entities || []).slice(0, 7)
    .map(e => `<b>${esc(e.name)}</b>`).join(' · ');

  const body = ex && ex.headline ? `
    <div class="headline">${esc(ex.headline)}</div>
    ${(ex.claims || []).length ? `<ul class="claims">${
      ex.claims.slice(0, 4).map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
    ${figs ? `<div class="figs">${figs}</div>` : ''}
    ${ex.so_what ? `<div class="sowhat">${esc(ex.so_what)}</div>` : ''}
    ${ents ? `<div class="ents">${ents}</div>` : ''}
    <details class="orig"><summary>original post</summary>
      <div class="text">${esc(it.text)}</div></details>`
    : `<div class="text">${esc(it.text)}</div>`;

  return `<div class="entry ${it.verdict === 'surface' ? 'surfaced' : ''}" data-id="${it.id}">
    <div class="byline">${bits.join('')}</div>
    ${body}
    ${(it.images || []).length ? `<div class="imgs">${
      it.images.map(u => `<img src="${esc(u)}" loading="lazy" alt="">`).join('')}</div>` : ''}
    ${also.length ? `<div class="also"><em>also reported by</em>${
      also.map(a => `<span class="who" onclick="ext('${a.url}')">@${esc(a.handle)}</span>`)
          .join('')}</div>` : ''}
    ${it.rationale ? `<div class="verdict"><em>judge's note</em>${esc(it.rationale)}</div>` : ''}
    <div class="row">
      ${rateable ? `
        <button class="act good ${it.rating === 'good' ? 'on' : ''}"
          onclick="rate('${it.id}','good',this)">Useful</button>
        <button class="act bad ${it.rating === 'bad' ? 'on' : ''}"
          onclick="rate('${it.id}','bad',this)">Not useful</button>` : ''}
      <button class="act" onclick="ext('${it.url}')">Open on X</button>
    </div>
  </div>`;
}

async function rate(id, verdict, el) {
  const on = el.classList.contains('on');
  const stats = on ? await api().unrate(id) : await api().rate(id, verdict, '');
  el.closest('.entry').querySelectorAll('.act.good,.act.bad')
    .forEach(b => b.classList.remove('on'));
  if (!on) el.classList.add('on');
  const c = document.getElementById('fbc');
  if (c) c.textContent = `${stats.good} useful · ${stats.bad} not · ${stats.disagreements} disagreements`;
}

function setTime(i, v) { if (v) SCHED.times[i] = v; }
function setLimit(v) { SCHED.judge_limit = Math.max(10, parseInt(v) || 60); }

function toggleStage(k) {

           oninput="strictPreview(this.value)" onchange="strictApply(this.value)">
    <div class="ticks">${LEVELS.map((l, i) =>

/* Dragging only re-reads stored scores, so the count updates instantly and
   nothing is written until the user lets go. */
function strictPreview(i) {
  const l = LEVELS[+i]; if (!l) return;
  document.getElementById('sname').textContent = l.label;
  document.getElementById('snote').textContent = l.note;
  document.getElementById('scount').textContent =
    `${num(l.count)} of ${num(LEVELS[0].count)} judged`;
  document.querySelectorAll('.ticks span').forEach((t, n) =>
    t.classList.toggle('on', n === +i));
}

async function strictApply(i) {
  const l = LEVELS[+i]; if (!l) return;
  const st = await api().strictness_set(l.key);
  LEVELS = st.levels;
  LEVEL_I = LEVELS.findIndex(x => x.key === st.current.key);
  render();
}

async function loadLevels() {
  const st = await api().strictness_status();
  LEVELS = st.levels;
  LEVEL_I = Math.max(0, LEVELS.findIndex(l => l.key === st.current.key));
}

    const parts = [

      ['stale',     f.stale || 0,           '#332c26', 'older than the window'],
      ['no text',   f.no_text || 0,         '#2a2622', 'link or emoji only'],
    ].filter(p => p[1] > 0);
    const total = parts.reduce((a, p) => a + p[1], 0) || 1;

    main.innerHTML = `<div class="wide-data">

async function unreadAll() { await api().mark_all_unseen(); render(); refreshUnread(); }

// Marked after a delay, not on render: a view flashed past on the way
// somewhere else has not been read, and marking it would quietly discard the
// only signal that says what is new.
function markSeenSoon(items) {
  clearTimeout(SEEN_TIMER);
  const ids = [];
  for (const it of items) {
    if (it.seen === false) ids.push(it.id);
    for (const a of it.also || []) ids.push(a.id);
  }
  if (!ids.length) return;
  SEEN_TIMER = setTimeout(async () => {
    await api().mark_seen(ids);
    refreshUnread();
  }, 2500);
}

async function refreshUnread() {
  const n = await api().unread();
  const badge = document.getElementById('unread');
  if (badge) badge.textContent = n ? n : '';
}

/* ---- search -------------------------------------------------------------- */
let LAST_QUERY = '';

async function renderSearch(main) {
  main.innerHTML = `<div class="wrap"><h1>Search</h1>
    <div class="lede">Everything collected, judged or not — most of the corpus never
      reaches the judge, and it is still the best record of what was said.</div>
    <div class="searchbar">
      <input id="q" placeholder="a claim, a model name, a phrase…" value="${esc(LAST_QUERY)}">
      <button class="act" onclick="doSearch()">Search</button>
    </div>
    <div id="results">${LAST_QUERY ? '' : '<div class="empty">meaning and wording both count — an exact string always ranks first</div>'}</div></div>`;
  const input = document.getElementById('q');
  input.focus();
  input.onkeydown = (e) => { if (e.key === 'Enter') doSearch(); };
  if (LAST_QUERY) doSearch();
}

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  const out = document.getElementById('results');
  if (!q) { out.innerHTML = ''; return; }
  LAST_QUERY = q;
  out.innerHTML = '<div class="empty busy">searching…</div>';
  const items = await api().search(q, 40);
  out.innerHTML = items.length
    ? `<div class="lede">${items.length} result${items.length === 1 ? '' : 's'}</div>`
      + items.map(it => entry(it, true)).join('')
    : `<div class="empty">nothing matched “${esc(q)}”</div>`;
}

async function cands(by, el) {
  if (el) { document.querySelectorAll('.tabs .act').forEach(b => b.classList.remove('on'));
            el.classList.add('on'); }
  const rows = await api().candidates(by, 40);
  document.getElementById('cl').innerHTML = rows.length ? rows.map(c => `
    <div class="cand">
      <div>
        <div class="byline" style="margin:0">
          <span class="who" onclick="ext('https://x.com/${esc(c.handle)}')">@${esc(c.handle)}</span>
          <span>follows ${c.seed_count}</span><span>replies ${c.reply_count}</span>
        </div>
        <div class="bio">${esc((c.bio || '').slice(0, 150))}</div>
      </div>
      <div class="row">
        <button class="act" onclick="ok('${esc(c.handle)}',this)">Track</button>
        <button class="act" onclick="no('${esc(c.handle)}',this)">Hide</button>
      </div>
    </div>`).join('') : `<div class="empty">none yet — run suggest or replies</div>`;
}
async function ok(h, el) { await api().approve(h); el.closest('.cand').remove(); }
async function no(h, el) { await api().reject(h); el.closest('.cand').remove(); }

async function stage(s) {
  const log = document.getElementById('log'), btn = document.getElementById('b-' + s);
  const res = await api().run_stage(s);
  if (!res.ok) { log.textContent = res.error; return; }
  btn.classList.add('busy');
  log.textContent = `${s} running…`;
}
window.onStageDone = (p) => {
  const btn = document.getElementById('b-' + p.stage);
  if (btn) btn.classList.remove('busy');
  const log = document.getElementById('log');
  if (log) log.textContent = `${p.stage} ${p.ok ? 'finished' : 'FAILED'}\n\n${p.output}`;
  status();
  // A step is only done when the system says so, so re-ask rather than assume
  // the stage that just finished is the one that unblocks it.
  if (view === 'setup') setTimeout(render, 400);
};

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); view = b.dataset.v; render();
});

// Every failure this system has is silent — an expired session collects zero
// posts and looks exactly like a quiet day. So the state of the machinery is
// always on screen, not behind a command nobody runs.
async function status() {
  const h = await api().health();
  document.getElementById('status').innerHTML =
    `<h4>Status</h4>` + h.checks.map(c => `
      <div class="chk ${c.level}" ${c.fix ? `title="${esc(c.fix)}"` : ''}>
        <i></i><span>${esc(c.label)}</span><b>${esc(c.detail)}</b>
      </div>`).join('');
}

async function boot() {
  const o = await api().overview();
  assay(o);
  status();
  refreshUnread();

  // An unconfigured tracker and a quiet day look identical on the Today page:
  // zeros everywhere. Open on the thing that is actually blocking instead.
  const setup = await api().setup_state();
  if (!setup.done) {
    view = 'setup';
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('on'));
    document.getElementById('setuplink').hidden = false;
  }
  render();
}
window.addEventListener('pywebviewready', boot);
if (window.pywebview) boot();
</script>
</body>
